        - code [ref=f1e681]: "@startuml title VRFによる二つのルーティングテーブルのイメージ(本社IPsecルータ) rectangle \"本社IPsecルータ\" { rectangle \"VRF 65000:1\\n(インターネット行き用)\" as VRF1 { rectangle \"INT-IF\\n(s.t.u.v)\" as INT1 } rectangle \"VRF 65000:2\\n(LAN/トンネル行き用)\" as VRF2 { rectangle \"LAN-IF\\n(172.17.0.1)\" as LAN1 rectangle \"トンネルIF\" as TUN1 } } cloud \"インターネット\\n(ISPのルータ)\" as INET rectangle \"L3SW(本社)\" as L3SW rectangle \"営業所のIPsecルータ\" as OfficeRT VRF1 --> INET : 宛先0.0.0.0/0\\n静的経路制御\\n(ISPのルータへ) VRF2 --> L3SW : 宛先0.0.0.0/0\\nネクストホップ=本社のL3SW\\n動的経路制御(OSPF) VRF2 --> OfficeRT : 宛先172.17.1.0/24(営業所のLAN)\\nネクストホップ=トンネルIF\\n静的経路制御 note as N4 同じ「0.0.0.0/0」という宛先でも、 VRF 65000:1(インターネット側)と VRF 65000:2(LAN側)とで別々の ルーティングテーブルに載っており、 ネクストホップも別々になる。 これがVRFで二つのテーブルを 持たせる理由。 end note @enduml"
