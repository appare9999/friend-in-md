        - 'heading "3. 問3: シングルサインオンの導入（ケルベロス認証）" [level=2] [ref=f1e804]'
        - heading "3-1. ネットワーク構成及び機器の設定と利用形態" [level=3] [ref=f1e805]
        - code [ref=f1e808]: "@startuml title 図1: 本社のネットワーク構成とFWルール(表1)の対応 cloud \"インターネット\" as INET rectangle \"ルータ\" as Router rectangle \"FW\" as FW rectangle \"DMZ\" #FFF3E0 { rectangle \"公開Webサーバ\" as WebSrv rectangle \"プロキシサーバ\" as Proxy rectangle \"外部DNSサーバ\" as ExtDNS } rectangle \"内部LAN\" #E8F0FE { rectangle \"PCセグメント\" as PCSeg rectangle \"サーバセグメント\" { rectangle \"社内DNSサーバ\" as IntDNS rectangle \"業務サーバ/営業支援サーバ\" as BizSrv rectangle \"DS1/DS2\" as DS } } INET --> Router Router --> FW FW .[#red].> ExtDNS : 行1: any→外部DNSサーバ\\nTCP/53,UDP/53 ExtDNS .[#red].> FW : 行3: 外部DNSサーバ→any\\nTCP/53,UDP/53 FW .[#blue].> WebSrv : 行2: any→公開Webサーバ\\nTCP/443 Proxy .[#green].> FW : 行4: プロキシサーバ→any\\nTCP/80,TCP/443 IntDNS .[#orange].> ExtDNS : 行5: 社内DNSサーバ→外部DNSサーバ\\nTCP/53,UDP/53 rectangle \"サーバセグメント\" as SS2 SS2 .[#purple].> Proxy : 行6: サーバセグメント→プロキシサーバ\\nTCP/8080 PCSeg .[#purple].> Proxy : 行7: PCセグメント→プロキシサーバ\\nTCP/8080 FW -- Router FW -- PCSeg FW -- IntDNS note as N6 ア=外部DNSサーバ, ウ=公開Webサーバ, エ=プロキシサーバ, オ=any, カ=社内DNSサーバ, イ=UDP/53 end note @enduml"
        - 'heading "設問1(1): 下線(a)の動作のために、PCのプロキシ設定で登録すべき内容は？（40字以内）" [level=3] [ref=f1e809]'
        - paragraph [ref=f1e810]:
          - strong [ref=f1e811]: "答え: 業務サーバと営業支援サーバのFQDNを、プロキシ例外リストに登録する。"
        - paragraph [ref=f1e812]: これは一般的なWebブラウザのプロキシ設定機能の知識（②）です。多くのブラウザ・OSのプロキシ設定には「この宛先だけはプロキシを経由せず直接接続する」という**例外リスト（bypass list）**機能があります。下線(a)「業務サーバ及び営業支援サーバへのアクセスは、プロキシサーバを経由せずWebブラウザから直接行う」を実現するには、この例外リストに両サーバのFQDNを登録します。
        - 'heading "設問1(2): 下線(b)について、(iii)〜(v)の実行のために必要な「その他のネットワーク情報」を二つ答えよ" [level=3] [ref=f1e813]'
        - paragraph [ref=f1e814]:
