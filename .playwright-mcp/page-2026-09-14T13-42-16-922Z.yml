              - strong [ref=f1e853]: イ＝UDP/53
              - text: です（②：DNSの一般知識）。行3（DMZ→インターネット、送信元ア、宛先any）は外部DNSサーバ自身が他のドメインの権威DNSサーバへ問い合わせにいく通信で、同じくア＝
