        - paragraph [ref=f1e797]:
          - text: 直前の文脈「R主任は、Q社SGWサービスがN社以外にも提供されていると考えて、④NAPTのためにQ社SGWサービスから割当てを受けたグローバルIPアドレスのサービス仕様を、Q社に確認した。」（①）から読み取ります。P社営業支援サービス側は「特定のIPアドレスから送信されたパケットだけを許可する」というアクセス制御をしているので、もしそのグローバルIPアドレスが
          - strong [ref=f1e798]: 他のQ社SGWサービス利用企業と共用
          - text: されていたら、そのアドレス経由で他社の通信までP社営業支援サービスへのアクセスが許可されてしまうリスクがあります。だからR主任は「N社専用のIPアドレスかどうか」を確認したと考えられます。
        - 'heading "設問3(2): 下線⑤について、P社営業支援サービスの応答時間が現行より長くなると考えられる要因は？（30字以内）" [level=3] [ref=f1e799]'
        - paragraph [ref=f1e800]:
          - strong [ref=f1e801]: "答え: Q社SGWサービスの経由によって発生する遅延"
        - paragraph [ref=f1e802]: 図2（①）の経路と現行構成（図1）を比べると、新構成ではPCからの通信が必ずQ社SGWサービスのPOPとFW機能を経由するようになります。中継する機器・処理段数が増える分、単純に伝送・処理にかかる時間が上乗せされるため、応答時間が伸びると考えられます（①の経路変化＋②のネットワーク遅延に関する一般知識）。
