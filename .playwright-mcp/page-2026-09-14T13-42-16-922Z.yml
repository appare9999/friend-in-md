              - strong [ref=f1e891]: 社内DNSサーバ
              - text: です。
        - heading "3-2. ケルベロス認証の概要と通信手順" [level=3] [ref=f1e892]
        - code [ref=f1e895]: "@startuml title 図2: PCの起動から営業支援サーバアクセスまでの通信手順(ケルベロス認証) actor \"社員\" as User participant \"PC\" as PC participant \"DS(KDC)\" as KDC participant \"営業支援サーバ\" as Srv User -> PC : PC起動/ID,PW入力 PC -> KDC : ①認証要求(ID, PW) KDC -> PC : ②認証成功(TGT)\\n※PCの鍵で暗号化 note right of PC ②はPCの鍵で暗号化されているため、 盗聴してもTGTの中身は復号できない。 end note User -> PC : Webブラウザ起動/\\n営業支援サーバアクセス PC -> Srv : ③HTTP要求 Srv -> PC : ④HTTP応答(401,\\nWWW-Authenticate: Negotiate) PC -> KDC : ⑤営業支援サーバ用のST要求(TGT) KDC -> PC : ⑥ST払出し(ST)\\n※営業支援サーバの鍵でST暗号化、\\nさらに全体をPCの鍵で暗号化 PC -> Srv : ⑦HTTP要求\\n(ケルベロス認証向けAPIでST提示) Srv -> PC : ⑧HTTP応答(200 OK, 認証成功) PC -> Srv : HTTP通信 note over PC, KDC ①②⑤⑥がKDC(ポート88)との\\nケルベロス認証そのものの通信。 ③④⑦⑧はPC⇔営業支援サーバ間のHTTP(S)通信。 end note @enduml"
        - 'heading "設問2(1): ②の通信を盗聴されても⑦を正しく行えない理由は？（15字以内）" [level=3] [ref=f1e896]'
        - paragraph [ref=f1e897]:
          - strong [ref=f1e898]: "答え: STを取り出せないから"
        - paragraph [ref=f1e899]: 本文⑥「KDCは…営業支援サーバの鍵でSTを暗号化する。さらに、KDCは、暗号化したSTにセッション鍵などを付加し、全体をPCの鍵で暗号化した情報をPCに払い出す。」（①）とあります。②の通信で送られるのはTGTであり、しかもPCの鍵で暗号化されています。⑦で提示すべき「ST」はこの②の通信には含まれておらず、⑤⑥という別の通信で別途取得するものです。したがって②を盗聴しただけでは、攻撃者は⑦で提示すべきSTそのものを手に入れることができません。
        - 'heading "設問2(2): 図2の中で、ポート88（ケルベロス認証サービス）が用いられる通信は？" [level=3] [ref=f1e900]'
        - paragraph [ref=f1e901]:
          - strong [ref=f1e902]: "答え: ①、②、⑤、⑥"
        - paragraph [ref=f1e903]: ケルベロス認証プロトコル自体の標準ポートが88であることは前提知識（②）です。図2の登場人物のうち、PCとKDC（DS）が直接やり取りしているのは①②（認証要求／TGT発行）と⑤⑥（ST要求／ST払出し）で、これがケルベロス認証そのものの通信です。③④⑦⑧はPC⇔営業支援サーバ間のHTTP（S）通信であり、別のポート（80/443）を使います（①：図2の登場人物の対応関係）。
        - 'heading "設問2(3): 下線(c)の問題を発生させないための対応策は？（20字以内）" [level=3] [ref=f1e904]'
        - paragraph [ref=f1e905]:
          - strong [ref=f1e906]: "答え: PCとサーバ間で時刻同期を行う。"
        - paragraph [ref=f1e907]: ケルベロス認証はチケットの有効期限判定に「現在時刻」を用いるため、PCとサーバの時計にずれがあると、有効期限内のチケットでも「期限切れ」と誤判定されることがある、というケルベロス認証の既知の弱点（②）です。対策として、NTPなどでPCとサーバの時刻を同期させます。
        - heading "3-3. SRVレコードの働きと設定内容" [level=3] [ref=f1e908]
        - code [ref=f1e911]: "@startuml title SRVレコードによるKDCの発見(図4のケース) participant \"PC\" as PC participant \"社内DNSサーバ\" as DNS participant \"DS1(KDC)\" as DS1 participant \"DS2(KDC)\" as DS2 PC -> DNS : SRVレコード問合せ\\n(_kerberos._tcp.naibulan.y-sha.jp) DNS -> PC : 応答: DS1(Priority120,Weight2)\\n DS2(Priority120,Weight1) note right of PC Priorityが同じなので、 Weightの比率(2:1)で 問い合わせ先を選ぶ。 TTL=43200秒(720分)の間は この結果をキャッシュする。 end note PC -> DS1 : 確率2/3でKDC通信を選択 PC -> DS2 : 確率1/3でKDC通信を選択 @enduml"
        - 'heading "設問3(1): SRVレコードを利用しない場合、PCに設定しなければならない情報は？（25字以内）" [level=3] [ref=f1e912]'
        - paragraph [ref=f1e913]:
          - strong [ref=f1e914]: "答え: ケルベロス認証を行うサーバのFQDN"
        - paragraph [ref=f1e915]: 本文「DNSサーバにSRVレコードが登録されていれば、サービス名を問い合わせることによって、当該サービスが稼働するホスト名などの情報が取得できる。」（①）の裏返しです。SRVレコードが無いと、PCはKDC（ケルベロス認証を行うサーバ）のホスト名を自動的に発見できないため、あらかじめそのFQDNをPC側に手動設定しておく必要があります。
        - 'heading "設問3(2): 図4のSRVレコードがPCのキャッシュに存在する時間は？" [level=3] [ref=f1e916]'
        - paragraph [ref=f1e917]:
          - strong [ref=f1e918]: "答え: 720分"
        - paragraph [ref=f1e919]:
          - text: 図4のTTL＝43200（秒）（①）。DNSレコードはTTLで指定された秒数だけキャッシュされる、というDNSの一般知識（②）から、43200秒 ÷ 60 =
          - strong [ref=f1e920]: 720分
          - text: です。
        - 'heading "設問3(3): 図5の1つのSRVレコードで、図4と同様の比率（2:1）でDS1・DS2を使わせるためのAレコードの設定内容は？（50字以内）" [level=3] [ref=f1e921]'
        - paragraph [ref=f1e922]:
          - strong [ref=f1e923]: "答え: ホスト名がDSに対して、add1のAレコードを二つ、add2のAレコードを一つ記述する。"
        - paragraph [ref=f1e924]:
          - text: 図4のWeightはDS1＝2、DS2＝1で、比率は2:1です（①）。図5では1本のSRVレコード（Target＝DS.naibulan.y-sha.jp）しかなく、Weightによる比率づけができないため、代わりに
          - strong [ref=f1e925]: DNSラウンドロビン
          - text: （②）で比率を再現します。具体的には、同じホスト名「DS」に対してAレコードを複数登録しておくと、登録数の割合に応じてランダムに異なるIPアドレスが返るようになるので、DS1のアドレス（add1）を2つ、DS2のアドレス（add2）を1つ登録すれば、図4と同じ2:1の比率を再現できます。
        - separator [ref=f1e926]
        - heading "4. まとめ（学習ポイント）" [level=2] [ref=f1e927]
        - list [ref=f1e928]:
          - listitem [ref=f1e930]:
            - paragraph [ref=f1e938]:
              - strong [ref=f1e939]: 問1
              - text: は、IT（事務所）とOT（工場）を繋ぐときのセキュリティ設計が題材でした。FTAは「ルーティングしないファイル受渡し専用アプライアンス」、NPBは「入出力ポートの組を事前定義してパケットを複製する装置」という役割の違いを正確に押さえることが全設問の土台です。ミラーポート（1ポートに集約）とネットワークタップ（送受信で2ポート）の帯域の違いは、実務でもよく問われる典型パターンです。
          - listitem [ref=f1e941]:
            - paragraph [ref=f1e949]:
              - strong [ref=f1e950]: 問2
              - text: は、VRFで「同じ宛先でも所属するテーブルが違えば別経路になる」という考え方と、IPsecの「IKE SA→Child SA」という2段階のネゴシエーション構造が核心でした。ESPのカプセル化の順番（トレーラ付加→暗号化→新IPヘッダ／ESPヘッダ付加）も頻出パターンです。
          - listitem [ref=f1e952]:
            - paragraph [ref=f1e960]:
              - strong [ref=f1e961]: 問3
              - text: はケルベロス認証の「TGTとSTの2段階チケット」「チケットは常に受信者の鍵で暗号化されているため盗聴だけでは中身が読めない」という设計と、SRVレコードによるサービスディスカバリ（Priority＝優先度、Weight＝同一優先度内の比率）の仕組みが核心でした。DNSラウンドロビンとSRVレコードのWeightは、どちらも負荷分散を実現する手段ですが、制御できる粒度が異なる点（Weightは明示的な比率指定、ラウンドロビンはAレコードの登録数で疑似的に比率を作る）を対比して理解しておくと応用が効きます。
        - paragraph [ref=f1e962]
