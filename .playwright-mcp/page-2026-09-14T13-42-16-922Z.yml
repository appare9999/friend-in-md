        - paragraph [ref=f1e792]: 本文「新IPsecルータ及びTPCとPOPは、IKE SAを確立するために必要な、暗号化アルゴリズム…をネゴシエーションして決定し、IKE SAを確立する。次に、新IPsecルータ及びTPCとPOPは、認証及びChild SAを確立するために必要な情報を、IKE SAを介してネゴシエーションして決定し、Child SAを確立する。」（①）とあり、確立作業が「IKE SA→Child SA」の2段階になっていると明記されています。IPsec VPNの確立に失敗したときは、まずどちらの段階まで進んでいるか（IKE SAが確立できているか、その先のChild SAが確立できているか）を切り分けて確認するのがトラブルシューティングの定石です（②）。
