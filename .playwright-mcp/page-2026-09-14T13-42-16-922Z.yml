            - paragraph [ref=f1e103]:
              - text: "解答:"
              - code [ref=f1e104]: 2022r04h_nw_pm1_ans.pdf
        - paragraph [ref=f1e105]: この解説では、まず3問に共通・関連する用語を整理し、そのあとで問題文の構成図をPlantUMLで描き直しながら、設問ごとに「なぜその答えになるのか」を本文の根拠つきで説明します。
        - paragraph [ref=f1e106]: 各表の「区分」列は次の意味です。
        - list [ref=f1e107]:
          - listitem [ref=f1e109]:
            - paragraph [ref=f1e117]:
              - strong [ref=f1e118]: ①
              - text: ": 問題文中に定義・説明がある用語（本文や図の注記を読めば意味が分かるもの）"
          - listitem [ref=f1e120]:
            - paragraph [ref=f1e128]:
              - strong [ref=f1e129]: ②
              - text: ": 問題文には説明がなく、前提知識として知っておく必要がある用語（一般的なネットワーク技術の知識）"
        - separator [ref=f1e130]
        - heading "0. 用語辞典" [level=2] [ref=f1e131]
        - heading "問1（ネットワークの更改）で登場する用語" [level=3] [ref=f1e132]
        - generic [ref=f1e143]:
          - button [ref=f1e144] [cursor=pointer]
          - button [ref=f1e149] [cursor=pointer]
          - table [ref=f1e154]:
            - rowgroup [ref=f1e155]:
              - row [ref=f1e156]:
                - columnheader [ref=f1e157]:
                  - paragraph [ref=f1e158]: 区分
                - columnheader [ref=f1e159]:
                  - paragraph [ref=f1e160]: 用語
                - columnheader [ref=f1e161]:
                  - paragraph [ref=f1e162]: 説明
              - row [ref=f1e163]:
                - cell [ref=f1e164]:
                  - paragraph [ref=f1e165]: ①
                - cell [ref=f1e166]:
                  - paragraph [ref=f1e167]: OAセグメント／DMZ／制御セグメント／管理セグメント
                - cell [ref=f1e168]:
                  - paragraph [ref=f1e169]: 本文冒頭で定義される、A社ネットワークの区画名。OAセグメント＝メール・資料作成等の事務作業用、DMZ＝社外との通信を行う区画、制御セグメント＝センサ・工作機械の制御用、管理セグメント＝ログ・測定データの管理用。
              - row [ref=f1e170]:
                - cell [ref=f1e171]:
                  - paragraph [ref=f1e172]: ②
                - cell [ref=f1e173]:
                  - paragraph [ref=f1e174]: Syslog（RFC 5424）
                - cell [ref=f1e175]:
                  - paragraph [ref=f1e176]: ログメッセージを別のサーバへ転送するための標準プロトコル。RFC 5424は「The Syslog Protocol」そのものを定めた規格書であり、規格名を知っていれば空欄aが埋まる。
              - row [ref=f1e177]:
                - cell [ref=f1e178]:
                  - paragraph [ref=f1e179]: ②
                - cell [ref=f1e180]:
                  - paragraph [ref=f1e181]: Basic認証／ダイジェスト認証
                - cell [ref=f1e182]:
                  - paragraph [ref=f1e183]: HTTPの標準的なユーザ認証方式。Basic認証はID:PWをBase64エンコードするだけ（平文に近い）。ダイジェスト認証はパスワードをMD5やSHA-256でハッシュ化してから送るため、Basic認証より安全。本文の「Base64でエンコードする…」「MD5やSHA-256でハッシュ化する…」という対比がヒントになる。
              - row [ref=f1e184]:
                - cell [ref=f1e185]:
                  - paragraph [ref=f1e186]: ②
                - cell [ref=f1e187]:
                  - paragraph [ref=f1e188]: HTTP CONNECTメソッド
                - cell [ref=f1e189]:
                  - paragraph [ref=f1e190]: プロキシサーバに、TCPコネクションをそのまま中継（トンネリング）させるためのHTTPメソッド。HTTPS通信をプロキシ経由させるときに使われ、宛先ポートは443に限定されるのが一般的。
              - row [ref=f1e191]:
                - cell [ref=f1e192]:
                  - paragraph [ref=f1e193]: ①
                - cell [ref=f1e194]:
                  - paragraph [ref=f1e195]: LDAP（Lightweight Directory Access Protocol）
                - cell [ref=f1e196]:
                  - paragraph [ref=f1e197]: 図1の注記に定義あり。ディレクトリサービスにアクセスするためのプロトコル。本文では内部メールサーバとプロキシサーバがユーザ認証のために参照する。
              - row [ref=f1e198]:
                - cell [ref=f1e199]:
                  - paragraph [ref=f1e200]: ①
                - cell [ref=f1e201]:
                  - paragraph [ref=f1e202]: FTA（ファイル転送アプライアンス）
                - cell [ref=f1e203]:
                  - paragraph [ref=f1e204]: 本文に定義あり。「分離された二つのネットワークでルーティングすることなくファイルの受渡しができるアプライアンス」。
              - row [ref=f1e205]:
                - cell [ref=f1e206]:
                  - paragraph [ref=f1e207]: ①
                - cell [ref=f1e208]:
                  - paragraph [ref=f1e209]: NPB（ネットワークパケットブローカ）
                - cell [ref=f1e210]:
                  - paragraph [ref=f1e211]: 本文に定義あり。「事前に入力ポート、出力ポートを設定し、入力したパケットを複数の出力ポートに複製する装置」。
              - row [ref=f1e212]:
                - cell [ref=f1e213]:
                  - paragraph [ref=f1e214]: ①
                - cell [ref=f1e215]:
                  - paragraph [ref=f1e216]: ネットワークタップ
                - cell [ref=f1e217]:
                  - paragraph [ref=f1e218]: 本文に定義あり。「既存の配線にインラインで接続し、パケットをNPBに複製する装置」。送信側・受信側それぞれの配線から複製するため入力ポートが2つ必要、と明記されている。
              - row [ref=f1e219]:
                - cell [ref=f1e220]:
                  - paragraph [ref=f1e221]: ②
                - cell [ref=f1e222]:
                  - paragraph [ref=f1e223]: ミラーポート（SPANポート）
                - cell [ref=f1e224]:
                  - paragraph [ref=f1e225]: L2SWの特定ポートを流れるフレームを、送信側・受信側ともに複製して別ポートへ出力する機能。1ポートに集約されるため帯域は物理ポート1本分（今回は1000BASE-SX＝1Gbps）に制限される。
              - row [ref=f1e226]:
                - cell [ref=f1e227]:
                  - paragraph [ref=f1e228]: ②
                - cell [ref=f1e229]:
                  - paragraph [ref=f1e230]: プロミスキャスモード
                - cell [ref=f1e231]:
                  - paragraph [ref=f1e232]: NICが本来受け取らない「自分宛てでないフレーム」も含めて全て受信するモード。パケットキャプチャを行うサーバ（可視化サーバ・キャプチャサーバ）で必須となる設定。
              - row [ref=f1e233]:
                - cell [ref=f1e234]:
                  - paragraph [ref=f1e235]: ②
                - cell [ref=f1e236]:
                  - paragraph [ref=f1e237]: フラッディング
                - cell [ref=f1e238]:
                  - paragraph [ref=f1e239]: L2SWが宛先MACアドレスをMACアドレステーブルに学習していないとき、受信ポート以外の全ポートにフレームを転送する動作。
        - heading "問2（セキュアゲートウェイサービスの導入）で登場する用語" [level=3] [ref=f1e240]
        - generic [ref=f1e251]:
          - button [ref=f1e252] [cursor=pointer]
          - button [ref=f1e257] [cursor=pointer]
          - table [ref=f1e262]:
            - rowgroup [ref=f1e263]:
              - row [ref=f1e264]:
                - columnheader [ref=f1e265]:
                  - paragraph [ref=f1e266]: 区分
                - columnheader [ref=f1e267]:
                  - paragraph [ref=f1e268]: 用語
                - columnheader [ref=f1e269]:
                  - paragraph [ref=f1e270]: 説明
              - row [ref=f1e271]:
                - cell [ref=f1e272]:
                  - paragraph [ref=f1e273]: ①
                - cell [ref=f1e274]:
                  - paragraph [ref=f1e275]: SGWサービス（セキュアゲートウェイサービス）
                - cell [ref=f1e276]:
                  - paragraph [ref=f1e277]: 本文に定義あり。「PCがインターネット上のサイトに接続する際に、送受信するパケットを本サービス経由とすることによって、ファイアウォール機能などの情報セキュリティ機能を提供する」。
              - row [ref=f1e278]:
                - cell [ref=f1e279]:
                  - paragraph [ref=f1e280]: ①
                - cell [ref=f1e281]:
                  - paragraph [ref=f1e282]: トンネルIF
                - cell [ref=f1e283]:
                  - paragraph [ref=f1e284]: 本文に定義あり。「IPsec VPNを確立したときに有効化される仮想インタフェース」。
              - row [ref=f1e285]:
                - cell [ref=f1e286]:
                  - paragraph [ref=f1e287]: ②
                - cell [ref=f1e288]:
                  - paragraph [ref=f1e289]: VRF（Virtual Routing and Forwarding）
                - cell [ref=f1e290]:
                  - paragraph [ref=f1e291]: "1台のルータの中に、独立した複数のルーティングテーブルを共存させる技術。テーブルはVRF識別子で区別する。同じ宛先アドレス（例: 0.0.0.0/0）でも、所属するVRFが違えば別々の経路として扱える。"
              - row [ref=f1e292]:
                - cell [ref=f1e293]:
                  - paragraph [ref=f1e294]: ②
                - cell [ref=f1e295]:
                  - paragraph [ref=f1e296]: OSPFへの経路再配布（redistribute）
                - cell [ref=f1e297]:
                  - paragraph [ref=f1e298]: OSPFの管理外で設定された経路（静的経路など）を、OSPFのLSAとして周囲のルータに広告し直す操作。
              - row [ref=f1e299]:
                - cell [ref=f1e300]:
                  - paragraph [ref=f1e301]: ②
                - cell [ref=f1e302]:
                  - paragraph [ref=f1e303]: IKE（Internet Key Exchange）／IKE SA／Child SA
                - cell [ref=f1e304]:
                  - paragraph [ref=f1e305]: IPsecの鍵交換プロトコル。まず暗号化アルゴリズムなどをネゴシエーションして制御用の安全な通信路（IKE SA）を確立し、そのIKE SA上でさらに実データ保護用の鍵（Child SA）をネゴシエーションする、という2段階構成になっている。
              - row [ref=f1e306]:
                - cell [ref=f1e307]:
                  - paragraph [ref=f1e308]: ②
                - cell [ref=f1e309]:
                  - paragraph [ref=f1e310]: ESP（Encapsulating Security Payload）
                - cell [ref=f1e311]:
                  - paragraph [ref=f1e312]: IPsecでパケットを暗号化・認証するためのプロトコル。トンネルモードでは、元のパケットにESPトレーラを付加してから暗号化し、その外側に新しいIPヘッダとESPヘッダ・認証データを付加する。
              - row [ref=f1e313]:
                - cell [ref=f1e314]:
                  - paragraph [ref=f1e315]: ②
                - cell [ref=f1e316]:
                  - paragraph [ref=f1e317]: Diffie-Hellmanグループ番号
                - cell [ref=f1e318]:
                  - paragraph [ref=f1e319]: "鍵交換に使う素数の長さ（＝鍵長）を指定する番号。番号が大きいほど鍵長が長く、より強い暗号強度になる（例: グループ1は768ビット、グループ14は2048ビット）。"
              - row [ref=f1e320]:
                - cell [ref=f1e321]:
                  - paragraph [ref=f1e322]: ②
                - cell [ref=f1e323]:
                  - paragraph [ref=f1e324]: NAPT（Network Address Port Translation）
                - cell [ref=f1e325]:
                  - paragraph [ref=f1e326]: プライベートIPアドレスとポート番号の組を、1つ以上のグローバルIPアドレスとポート番号の組に変換する技術。複数端末で1つのグローバルIPアドレスを共有できる。
        - heading "問3（シングルサインオンの導入）で登場する用語" [level=3] [ref=f1e327]
        - generic [ref=f1e338]:
          - button [ref=f1e339] [cursor=pointer]
          - button [ref=f1e344] [cursor=pointer]
          - table [ref=f1e349]:
            - rowgroup [ref=f1e350]:
              - row [ref=f1e351]:
                - columnheader [ref=f1e352]:
                  - paragraph [ref=f1e353]: 区分
                - columnheader [ref=f1e354]:
                  - paragraph [ref=f1e355]: 用語
                - columnheader [ref=f1e356]:
                  - paragraph [ref=f1e357]: 説明
              - row [ref=f1e358]:
                - cell [ref=f1e359]:
                  - paragraph [ref=f1e360]: ①
                - cell [ref=f1e361]:
                  - paragraph [ref=f1e362]: SSO（シングルサインオン）
                - cell [ref=f1e363]:
                  - paragraph [ref=f1e364]: 本文に定義あり。1回のログインで複数のシステムを利用できるようにする仕組み。
              - row [ref=f1e365]:
                - cell [ref=f1e366]:
                  - paragraph [ref=f1e367]: ①
                - cell [ref=f1e368]:
                  - paragraph [ref=f1e369]: DS（ディレクトリサーバ）
                - cell [ref=f1e370]:
                  - paragraph [ref=f1e371]: 図1の注記に定義あり。アカウント情報を一元管理するサーバ。
              - row [ref=f1e372]:
                - cell [ref=f1e373]:
                  - paragraph [ref=f1e374]: ①
                - cell [ref=f1e375]:
                  - paragraph [ref=f1e376]: ケルベロス認証／KDC（鍵配布センタ）
                - cell [ref=f1e377]:
                  - paragraph [ref=f1e378]: 本文に定義あり。「共通鍵暗号による認証及びデータの暗号化」を行う認証方式。KDCは「PCとサーバの鍵の管理及びチケットの発行を行う」機能で、DS上で稼働する。
              - row [ref=f1e379]:
                - cell [ref=f1e380]:
                  - paragraph [ref=f1e381]: ①
                - cell [ref=f1e382]:
                  - paragraph [ref=f1e383]: TGT（Ticket Granting Ticket）／ST（Service Ticket）
                - cell [ref=f1e384]:
                  - paragraph [ref=f1e385]: 本文に定義あり。TGT＝「PCの利用者の身分証明書に相当するチケット」、ST＝「PCの利用者がサーバでの認証を受けるためのチケット」。
              - row [ref=f1e386]:
                - cell [ref=f1e387]:
                  - paragraph [ref=f1e388]: ①
                - cell [ref=f1e389]:
                  - paragraph [ref=f1e390]: SRVレコード
                - cell [ref=f1e391]:
                  - paragraph [ref=f1e392]: 本文に定義あり。「サービス名を問い合わせることによって、当該サービスが稼働するホスト名などの情報が取得できる」DNSリソースレコード。Priority（優先度）とWeight（比率）で複数レコードの使い分けを制御する。
              - row [ref=f1e393]:
                - cell [ref=f1e394]:
                  - paragraph [ref=f1e395]: ②
                - cell [ref=f1e396]:
                  - paragraph [ref=f1e397]: プロキシ例外リスト（bypass list）
                - cell [ref=f1e398]:
                  - paragraph [ref=f1e399]: Webブラウザのプロキシ設定において、「このFQDN・アドレスへの通信はプロキシを経由せず直接行う」と指定するための除外リスト機能。一般的なブラウザ設定機能で、本文には直接の記述はない。
              - row [ref=f1e400]:
                - cell [ref=f1e401]:
                  - paragraph [ref=f1e402]: ②
                - cell [ref=f1e403]:
                  - paragraph [ref=f1e404]: ステートフルパケットインスペクション（SPI）
                - cell [ref=f1e405]:
                  - paragraph [ref=f1e406]: FWが通信のコネクション状態（TCPの往復など）を把握し、往路の通信を許可したら復路の応答パケットは自動的に許可する機能。表1の注記に「FWはステートフルパケットインスペクション機能をもつ」とあるため、表1には往路方向のルールしか載っていない。
              - row [ref=f1e407]:
                - cell [ref=f1e408]:
                  - paragraph [ref=f1e409]: ②
                - cell [ref=f1e410]:
                  - paragraph [ref=f1e411]: DNSラウンドロビン
                - cell [ref=f1e412]:
                  - paragraph [ref=f1e413]: 同じホスト名に複数のAレコードを登録しておき、問い合わせに対して順番（または多重登録した分だけ確率的）に異なるIPアドレスを返すことで負荷分散する手法。
