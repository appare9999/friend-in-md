        - 'heading "設問1(3)・(4): 表1の空欄ア〜カ" [level=3] [ref=f1e837]'
        - paragraph [ref=f1e838]:
          - strong [ref=f1e839]: "答え: ア＝外部DNSサーバ／ウ＝公開Webサーバ／エ＝プロキシサーバ／オ＝any／カ＝社内DNSサーバ／イ＝UDP/53"
        - list [ref=f1e840]:
          - listitem [ref=f1e842]:
            - paragraph [ref=f1e850]:
              - strong [ref=f1e851]: ア・イ（行1・3）
              - text: ": 本文(ii)「外部DNSサーバは、DMZのゾーン情報の管理及びフルサービスリゾルバの機能をもっている。外部DNSサーバは、社外からの再帰問合せ要求は受け付けない。」（①）。行1（インターネット→DMZ、宛先ア、TCP/53,イ）は外部からDMZ内DNSサーバへの限定的な問合せ（再帰なし、権威応答のみ）を許可するルールで、宛先は"
              - strong [ref=f1e852]: 外部DNSサーバ
