        - 'heading "設問2(2): POPとのIPsec VPNを確立できない場合、失敗しているネゴシエーションを特定するために確認すべき状態は？（本文の字句で二つ）" [level=3] [ref=f1e789]'
        - paragraph [ref=f1e790]:
