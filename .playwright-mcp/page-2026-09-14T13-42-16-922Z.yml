              - strong [ref=f1e865]: ウ（行2）
              - text: ": インターネット→DMZ、宛先ウ、TCP/443。社外から直接HTTPSアクセスされる対象は、DMZ内で唯一「外部公開」を目的とするサーバ、すなわち"
              - strong [ref=f1e866]: 公開Webサーバ
              - text: です（①：図1の構成＋一般的なDMZ設計）。
          - listitem [ref=f1e868]:
            - paragraph [ref=f1e876]:
              - strong [ref=f1e877]: エ・オ（行4）
              - text: ": DMZ→インターネット、送信元エ、宛先オ、TCP/80,443。本文(v)「マルウェア定義ファイルの更新は、プロキシサーバ経由で行う。」（①）から、DMZ側からインターネットのWebサイトへ実際にアクセスするのは"
              - strong [ref=f1e878]: プロキシサーバ
