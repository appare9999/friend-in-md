        - 'heading "設問1(5): 下線②について、静的なデフォルトルートが必要な理由は？（40字以内）" [level=3] [ref=f1e710]'
        - paragraph [ref=f1e711]:
          - strong [ref=f1e712]: "答え: ISPが割り当てる営業所のIPsecルータのIPアドレスが動的だから"
        - paragraph [ref=f1e713]: 表1の注4「w.x.y.zは、ISPから割り当てられた動的なグローバルIPアドレスである。」（①、営業所IPsecルータのINT-IF）が根拠です。IPsec VPNの接続先（営業所IPsecルータ）のグローバルIPアドレスが動的に変化しうるため、特定のIPアドレス宛の静的経路を書くことができません。そこで「宛先を特定しない」デフォルトルート（0.0.0.0/0、VRF 65000:1側でISPのルータへ）を使うことで、相手のアドレスが変わってもインターネットへ出られるようにしています。
        - paragraph [ref=f1e714]:
          - strong [ref=f1e715]: 補足（なぜ「デフォルトルート」だと相手のIPアドレスが変わっても大丈夫なのか）
        - list [ref=f1e716]:
          - listitem [ref=f1e718]:
            - paragraph [ref=f1e726]: 通常の静的経路は「宛先ネットワーク（例：w.x.y.z/32）→ネクストホップ」という1対1の対応をルータに設定します。もしこの方式で本社IPsecルータからISPへの経路を書くなら、宛先は「営業所IPsecルータの現在のグローバルIPアドレス w.x.y.z」そのものになります。しかしw.x.y.zはISPが動的に割り当てるアドレスなので、いつ変わるか分かりません。変わるたびに本社側の経路設定を書き換えるのは非現実的です。
          - listitem [ref=f1e728]:
            - paragraph [ref=f1e736]: 一方、0.0.0.0/0という宛先は「他のどの経路にも一致しない、すべてのパケット」を表す特別な書き方です（家庭用ルータの「デフォルトゲートウェイ」と同じ考え方）。つまり「宛先が誰であっても、とりあえずISPのルータへ送る」という経路であり、宛先アドレスの中身を一切見ずにマッチします。
          - listitem [ref=f1e738]:
            - paragraph [ref=f1e746]: 実際にVPN用のIPsecトンネルを確立する際は、営業所IPsecルータ側からVPN接続を開始（あるいは本社側がその時点のw.x.y.z宛てにパケットを送る）することで、通信の中でその時点の実アドレスが使われます。本社IPsecルータの経路表に「w.x.y.z宛」という個別のエントリを持たせておく必要はなく、「インターネット方向は全部ISPのルータへ投げる」という1本の経路（デフォルトルート）だけ用意しておけば、w.x.y.zがどんな値に変わってもその経路に乗って届く、という仕組みです。
