        - 'heading "1. 問1: ネットワークの更改（IT/OT接続）" [level=2] [ref=f1e415]'
        - heading "1-1. 現状のネットワーク構成（図1）" [level=3] [ref=f1e416]
        - code [ref=f1e419]: "@startuml title 図1: A社ネットワークの構成(現状) cloud \"インターネット\" as INET rectangle \"事務所\" #E8F0FE { rectangle \"DMZ\" { rectangle \"外部メールサーバ\" as ExtMail rectangle \"プロキシサーバ\" as Proxy rectangle \"L2SW(DMZ)\" as L2SW_DMZ L2SW_DMZ -- ExtMail L2SW_DMZ -- Proxy } rectangle \"OAセグメント\" { rectangle \"内部メールサーバ\" as IntMail rectangle \"LDAPサーバ\" as LDAP rectangle \"PC\" as PC rectangle \"L2SW(OA)\" as L2SW_OA L2SW_OA -- IntMail L2SW_OA -- LDAP L2SW_OA -- PC } rectangle \"FW\" as FW FW -- L2SW_DMZ FW -- L2SW_OA } INET -- FW rectangle \"工場\" #FFF3E0 { rectangle \"制御セグメント\" { rectangle \"コントローラ\\n(センサ/工作機械)\" as Ctrl rectangle \"L2SW(制御)\" as L2SW_C L2SW_C -- Ctrl } rectangle \"管理セグメント\" { rectangle \"操作端末\" as OpTerm rectangle \"データヒストリアン\" as Hist rectangle \"制御サーバ\" as CtrlSrv rectangle \"L2SW(管理)\" as L2SW_M L2SW_M -- OpTerm L2SW_M -- Hist L2SW_M -- CtrlSrv } L2SW_C -- CtrlSrv : ルーティングなし\\n(制御サーバはL3中継しない) } note as N1 事務所と工場の間はネットワーク非接続。 制御セグメントと管理セグメントの間も、 制御サーバは設置されているがルーティングは行わない (両セグメントは論理的に分離されたまま)。 end note @enduml"
        - paragraph [ref=f1e420]:
          - strong [ref=f1e421]: ポイント
          - text: ": DMZとOAセグメントはFWで分離され、事務所と工場はそもそもネットワークで繋がっていません。工場内でも「制御セグメント」と「管理セグメント」は制御サーバを挟んで隣接していますが、制御サーバはルーティングを行わないため、この2つも論理的に分離されたセグメントのままです。"
        - 'heading "設問1(1): 空欄a〜c" [level=3] [ref=f1e422]'
        - paragraph [ref=f1e423]:
          - strong [ref=f1e424]: 答え
        - list [ref=f1e425]:
          - listitem [ref=f1e427]:
            - paragraph [ref=f1e435]:
              - text: a =
              - strong [ref=f1e436]: Syslog
          - listitem [ref=f1e438]:
            - paragraph [ref=f1e446]:
              - text: b =
              - strong [ref=f1e447]: ダイジェスト
          - listitem [ref=f1e449]:
            - paragraph [ref=f1e457]:
              - text: c =
              - strong [ref=f1e458]: CONNECT
        - paragraph [ref=f1e459]:
          - strong [ref=f1e460]: 根拠
        - list [ref=f1e461]:
          - listitem [ref=f1e463]:
            - paragraph [ref=f1e471]: "a: 本文「ログデータの転送は、イベント通知を転送する標準規格（RFC 5424）の[ a ]プロトコルを利用している。」→ RFC 5424は「The Syslog Protocol」という規格書そのものなので、規格番号を知っていれば a = Syslog と一意に決まります（②：RFC番号とプロトコル名の対応は前提知識）。"
          - listitem [ref=f1e473]:
            - paragraph [ref=f1e481]:
              - text: "b: 本文「プロキシサーバのユーザ認証には、Base64でエンコードするBasic認証方式と、MD5やSHA-256でハッシュ化する[ b ]認証方式があるが」→ HTTP認証方式のうち、パスワードをハッシュ化して送るのは"
              - strong [ref=f1e482]: ダイジェスト認証
              - text: です（②：HTTP認証方式の一般知識ですが、本文の「Base64でエンコード」対「ハッシュ化」という対比が強いヒントになっています）。
          - listitem [ref=f1e484]:
            - paragraph [ref=f1e492]:
              - text: "c: 本文「プロキシサーバは、HTTPの[ c ]メソッドでトンネリング通信を提供し、トンネリング通信に利用する通信ポートを443に限定する。」→ HTTPでTCPコネクションをそのまま中継させるメソッドは"
              - strong [ref=f1e493]: CONNECT
              - text: メソッドで、HTTPS（ポート443）通信をプロキシ経由させる際の定番の使い方と一致します（②：HTTPメソッドの前提知識）。
        - 'heading "設問1(2): DMZに設置するとOAセグメントに設置するのに比べて軽減されるセキュリティリスクは？（40字以内）" [level=3] [ref=f1e494]'
        - paragraph [ref=f1e495]:
          - strong [ref=f1e496]: "答え: 社外からサーバに侵入されたときにOAセグメントの機器に侵入されるリスク（が軽減される）"
        - paragraph [ref=f1e497]: これは本文に直接の説明がない、一般的なネットワークセキュリティ設計の知識（②）で答える設問です。外部公開サーバ（外部メールサーバ、プロキシサーバ）はインターネットから直接アクセスされる分、攻撃を受けて乗っ取られるリスクが内部サーバより高くなります。これをOAセグメントに同居させてしまうと、そのサーバを踏み台にして同一セグメント内のPCや内部メールサーバへ横方向に侵入（ラテラルムーブメント）されるおそれがあります。FWで独立したDMZに隔離しておけば、たとえDMZ内のサーバが侵入されても、DMZ→OAセグメント方向の通信はFWのルールで制限されるため、OAセグメント側への被害拡大を抑えられます。
        - heading "1-2. 管理セグメントとOAセグメント間のファイルの受渡し（FTA）" [level=3] [ref=f1e498]
        - code [ref=f1e501]: "@startuml title 図2: ベンダが提案したA社ネットワークの構成(更改後・抜粋) rectangle \"事務所\" #E8F0FE { rectangle \"OAセグメント\" { rectangle \"可視化サーバ\" as Vis rectangle \"キャプチャサーバ\" as Cap rectangle \"L2SW(OA)\" as L2SW_OA L2SW_OA -- Vis L2SW_OA -- Cap } } rectangle \"工場\" #FFF3E0 { rectangle \"制御セグメント\" { rectangle \"コントローラ等\" as Ctrl rectangle \"L2SW(制御)\" as L2SW_C L2SW_C -- Ctrl } rectangle \"管理セグメント\" { rectangle \"操作端末\" as OpTerm rectangle \"データヒストリアン\" as Hist rectangle \"制御サーバ\" as CtrlSrv rectangle \"L2SW(管理)\" as L2SW_M rectangle \"FTA\" as FTA L2SW_M -- OpTerm L2SW_M -- Hist L2SW_M -- CtrlSrv L2SW_M -- FTA } rectangle \"NPB\" as NPB L2SW_C -- CtrlSrv L2SW_C ..> NPB : ミラーポート\\n(制御サーバ接続ポートを複製) } FTA .[#blue].> L2SW_OA : HTTPSでファイル授受\\n(管理セグメント⇔OAセグメント\\nルーティングなしで受渡し) NPB .[#green].> Vis : ミラーパケット複製① NPB .[#green].> Cap : ミラーパケット複製② note as N2 FTAはルーティングを行わずファイルだけを橋渡しする アプライアンス(指示(c): 制御/管理セグメントとOA セグメントの間はルーティングを行わない、を満たす)。 NPBは1入力ポートに対し出力ポートを2つ設定し、 ミラーパケットを可視化サーバとキャプチャサーバの 両方に複製して送る。 end note @enduml"
        - 'heading "設問2(1): 下線①のFTAへのログイン認証を既存のサーバで一元管理するなら、どのサーバから認証情報を取得するのが良いか？" [level=3] [ref=f1e502]'
        - paragraph [ref=f1e503]:
          - strong [ref=f1e504]: "答え: LDAPサーバ"
        - paragraph [ref=f1e505]: 本文の「現状のネットワーク」の記述に、「社員のメールボックスをもつ内部メールサーバと、プロキシサーバは、ユーザ認証のためにLDAPサーバを参照する。」とあります。既にLDAPサーバがA社の認証情報を一元管理する役割を担っていることが明記されているので（①）、新たに追加するFTAもこのLDAPサーバに認証情報を問い合わせるのが自然です。
        - 'heading "設問2(2): 下線②について、FTAにアクセスできるのはどのセグメントか？（全て答えよ）" [level=3] [ref=f1e506]'
        - paragraph [ref=f1e507]:
          - strong [ref=f1e508]: "答え: 管理セグメント、OAセグメント"
        - paragraph [ref=f1e509]: 指示(a)「データヒストリアンにあるログデータをPCにファイル送信できるようにする。またPCにダウンロードしたソフトウェア更新ファイルを操作端末にファイル送信できるようにする。」から、FTAでファイルをやり取りする当事者は「データヒストリアン・操作端末（＝管理セグメントの機器）」と「PC（＝OAセグメントの機器）」であるとわかります（①）。図2でもFTAは管理セグメントに設置され、事務所側のL2SW（OAセグメント）とも接続線があります。制御セグメントの機器（コントローラ等）がFTAを使うという記述は本文になく、また指示(c)により制御セグメント自体がOAセグメントと直接やり取りすることもありません。
        - 'heading "設問2(3): 下線③について、FTAにおいて認証と認可はそれぞれ何のために使われるか（違いが分かるようにそれぞれ25字以内）" [level=3] [ref=f1e510]'
        - paragraph [ref=f1e511]:
          - strong [ref=f1e512]: "答え: 認証＝FTAの利用者が本人であることを確認するため／認可＝操作ごとに実行権限を有するかを確認するため"
        - paragraph [ref=f1e513]:
          - text: これは「認証」と「認可」という2つのセキュリティ用語の違いを問う、前提知識（②）中心の設問です。本文には「FTAは、認証及び認可に必要な情報について、既存のサーバを参照する。」としか書かれていません。ただし表1（FTAの利用時の流れ）を見ると、①アップロード時にログイン（本人確認＝
          - strong [ref=f1e514]: 認証
          - text: ）が行われ、③承認時には「上長だけが行うことができる」という
          - strong [ref=f1e515]: 操作ごとの権限チェック
          - text: （＝
          - strong [ref=f1e516]: 認可
          - text: ）が行われていることが読み取れ、認証と認可が別々の場面で使われていることのヒントになっています。
        - heading "1-3. 測定データの可視化（NPB・ミラーポート）" [level=3] [ref=f1e517]
        - 'heading "設問3(1): 空欄d" [level=3] [ref=f1e518]'
        - paragraph [ref=f1e519]:
          - strong [ref=f1e520]: "答え: d = フラッディング"
        - paragraph [ref=f1e521]:
          - text: "本文（ベンダとの会話）: 「宛先MACアドレスがMACアドレステーブルに学習済みかどうかを確認した上で、学習済みの場合には学習されているポートに転送します。宛先MACアドレスが学習されていない場合は[ d ]します。」→ これはL2SWの標準的な転送動作の知識（②）で、学習していない宛先へは受信ポート以外の全ポートへ"
          - strong [ref=f1e522]: フラッディング
          - text: します。
        - 'heading "設問3(2): 下線④について、ミラーポート方式はネットワークタップ方式と比べて性能面でどのような制約が生じるか？（40字以内）" [level=3] [ref=f1e523]'
        - paragraph [ref=f1e524]:
          - strong [ref=f1e525]: "答え: 送信側と受信側のトラフィックを合計1Gビット/秒までしか取り込めない。"
        - code [ref=f1e528]: "@startuml title ミラーポート方式とネットワークタップ方式のポート数比較 rectangle \"制御セグメントのL2SW\" as L2SW rectangle \"【ミラーポート方式(今回採用)】\" as Box1 { rectangle \"NPB\\n入力ポート×1\" as NPB1 } L2SW -[#blue]-> NPB1 : ミラーポート1本に\\n送信側・受信側\\n両方のトラフィックを集約\\n(ケーブルは1000BASE-SX=1Gbps) rectangle \"【ネットワークタップ方式(不採用)】\" as Box2 { rectangle \"NPB\\n入力ポート×2\" as NPB2 } L2SW -[#red]-> NPB2 : 送信側の配線から複製 L2SW -[#red]-> NPB2 : 受信側の配線から複製\\n(2本の物理ポートで受信) note as N3 ミラーポート方式は1ポート(1Gbps)に 送信+受信の両トラフィックを集約するため、 合計で最大1Gビット/秒までしか取り込めない。 タップ方式は送信用・受信用を別ポート(計2ポート) で受けるため、この制約を受けない。 end note @enduml"
        - paragraph [ref=f1e529]: 根拠は2つの本文情報の組み合わせです（①）。
        - list [ref=f1e530]:
          - listitem [ref=f1e532]:
            - generic [ref=f1e533]: "1."
            - paragraph [ref=f1e537]: 「NPBにつながるケーブルは全て1000BASE-SXです。」→ 1本のケーブル（＝1ポート）の上限は1Gビット/秒。
          - listitem [ref=f1e539]:
            - generic [ref=f1e540]: "2."
            - paragraph [ref=f1e544]: ネットワークタップ方式の説明「送信側、受信側、それぞれの配線でパケットを複製するので、NPBの入力ポートは2ポート必要です。」→ タップ方式は送信用と受信用で別ポート（合計2Gbps分の余地）を使えるのに対し、ミラーポート方式は1つのポートに送信側・受信側のトラフィックの両方を集約して出力するため、そのポート1本（1Gbps）が上限になってしまいます。
        - 'heading "設問3(3): 下線⑤について、1ポートだけからミラーパケットを取得する場合、どの装置が接続されているポートを設定すべきか？" [level=3] [ref=f1e545]'
        - paragraph [ref=f1e546]:
          - strong [ref=f1e547]: "答え: 制御サーバ"
        - paragraph [ref=f1e548]: 本文のデータフローの記述を辿ります（①）。「コントローラは、更改前と同様に測定データを制御サーバに常時送信する。」→ 制御セグメント内の全コントローラの測定データは、最終的に必ず制御サーバへ向けて送信されます。つまり制御セグメントのL2SWの中で、「全てのトラフィックが集約して通過する1点」は制御サーバが接続されたポートです。1ポートしかミラーリングできないという制約下では、ここを選ぶのが最も合理的です。
        - paragraph [ref=f1e549]:
          - strong [ref=f1e550]: 下線⑤の文自体の意味を分解する
        - paragraph [ref=f1e551]: まず下線⑤「制御セグメントに設置されているL2SWの特定ポートにミラー設定を行い、L2SWの該当ポートの送信側、受信側、双方のパケットを複製してNPBに送信させる。」という一文自体を、要素ごとに分解して読み解きます（②：L2SWのポートとパケットの向きに関する前提知識）。
        - list [ref=f1e552]:
          - listitem [ref=f1e554]:
            - paragraph [ref=f1e562]:
              - strong [ref=f1e563]: 「特定ポート」とは
              - text: ": L2SWには機器を接続するための物理ポートが複数あります（例: ポート1にコントローラA、ポート2にコントローラB、ポート8に制御サーバ、というように、1つの物理ポートに1台の機器がケーブルで接続されるイメージです）。「特定ポートにミラー設定を行う」とは、この複数あるポートの中から"
              - strong [ref=f1e564]: 1つだけを選んで
              - text: 、「このポートを流れるパケットは複製してNPBにも送る」という設定をL2SWに対して行う、という意味です。裏を返せば、選ばれなかった他のポートを流れるパケットは複製されません。
          - listitem [ref=f1e566]:
            - generic [ref=f1e573]:
              - paragraph [ref=f1e574]:
                - strong [ref=f1e575]: 「送信側、受信側」とは
                - text: ": 1本のポート（1本のケーブル）には、データが2つの向きに流れます。"
              - list [ref=f1e576]:
                - listitem [ref=f1e578]:
                  - paragraph [ref=f1e586]:
                    - strong [ref=f1e587]: 受信側（Rx）
                    - text: ": 接続されている機器（例: 制御サーバ）からL2SWに向かって流れてくるパケット。"
                - listitem [ref=f1e589]:
                  - paragraph [ref=f1e597]:
                    - strong [ref=f1e598]: 送信側（Tx）
                    - text: ": L2SWから接続されている機器（例: 制御サーバ）に向かって流れていくパケット。 「双方のパケットを複製する」というのは、このRx・Tx両方向のパケットをまとめてコピーする、という意味です。つまり制御サーバ接続ポートを選んだ場合、「制御サーバが送ってきたパケット」も「制御サーバへ向けて送られるパケット」も両方ともNPBに複製されます。"
          - listitem [ref=f1e600]:
            - paragraph [ref=f1e608]:
              - strong [ref=f1e609]: 「複製してNPBに送信させる」とは
              - text: ": 元のパケットは通常どおり本来の宛先（制御サーバなど）にもそのまま届きます。それとは別にコピーだけがNPBという追加の出力ポートにも送られる、という点が重要です。つまりミラーリングは既存の通信を妨げず、盗み見用の複製だけを横から取り出す仕組みです。"
        - paragraph [ref=f1e610]:
          - strong [ref=f1e611]: なぜ「全トラフィックが集約する1点」を探す必要があるのか
        - paragraph [ref=f1e612]:
          - text: 以上を踏まえると、ミラー機能は、L2SW全体を流れる全パケットを複製してくれるわけではなく、
          - strong [ref=f1e613]: 指定した1つの物理ポートを出入りするパケットだけ
          - text: を複製する仕組みだということが分かります（①：本文の下線⑤より）。
        - paragraph [ref=f1e614]: したがって、もし例えばコントローラ1台だけが接続されたポートをミラー対象に選んでしまうと、複製されるのはそのコントローラ1台分のデータだけになり、他のコントローラの測定データはNPB（延いては可視化サーバ・キャプチャサーバ）に一切届きません。今回の目的は「測定データの可視化」、つまり全コントローラ分のデータを漏れなく取得することなので、これでは目的を達成できません。
        - paragraph [ref=f1e615]: 一方、コントローラは全て「制御サーバへ測定データを送信する」という共通の宛先を持っています。L2SWの中でどのコントローラのポートから入ってきたフレームであっても、最終的には制御サーバ行きとして必ず制御サーバ接続ポートを経由して出ていきます（②：L2SWは宛先MACアドレスに基づき該当ポートへのみ転送するため、複数の送信元からの通信でも宛先が同じなら同じ出力ポートに集まる）。つまり制御サーバ接続ポートは、いわば全コントローラのデータが合流する"川下"にあたる場所であり、ここを1ポートだけミラーすれば、コントローラの台数に関係なく全員分のデータを一度に取得できます。これが「1ポートしか使えない」という制約の下で「全トラフィックが集約して通過する1点」を探さなければならない理由です。
        - code [ref=f1e618]: "@startuml title なぜ「制御サーバ接続ポート」を選ぶ必要があるのか rectangle \"制御セグメントのL2SW\" { rectangle \"コントローラA\" as CA rectangle \"コントローラB\" as CB rectangle \"コントローラC\" as CC rectangle \"制御サーバ接続ポート\" as PortSrv } rectangle \"制御サーバ\" as Srv CA -[#blue]-> PortSrv : 測定データ CB -[#blue]-> PortSrv : 測定データ CC -[#blue]-> PortSrv : 測定データ PortSrv -[#blue]-> Srv note as N1 ミラー設定できるのは特定の1ポートだけ。 コントローラAのポートをミラーすると Aのデータしか取れずB・Cは欠落する。 制御サーバ接続ポートなら全コントローラの データが必ずここを通過するので、 1ポートのミラーだけで全データを取得できる。 end note @enduml"
        - 'heading "設問3(4): サーバでミラーパケットを受信するためのインタフェースのモードと、それによって受信できるようになるフレームは？（30字以内）" [level=3] [ref=f1e619]'
        - paragraph [ref=f1e620]:
          - strong [ref=f1e621]: "答え: モード＝プロミスキャス／フレーム＝宛先MACアドレスが自分のMACアドレス以外のフレーム"
        - paragraph [ref=f1e622]: 前提知識（②）です。少し丁寧に、NICの動作原理から説明します。
        - paragraph [ref=f1e623]:
          - strong [ref=f1e624]: 通常のNICがしていること（フィルタリング）
        - paragraph [ref=f1e625]: ケーブル（イーサネット）には本来、そのセグメントに流れる全てのフレームが物理的に届いています。しかし、通常のNIC（普段パソコンやサーバに挿さっているネットワークカード）は、届いたフレームを全部OSに渡すわけではありません。NIC自身がハードウェアレベルでフレームの「宛先MACアドレス」をチェックし、次の3種類だけを上位層（OS・アプリケーション）に渡し、それ以外は自分宛てでないと判断してその場で捨てています。
        - list [ref=f1e626]:
          - listitem [ref=f1e628]:
            - generic [ref=f1e629]: "1."
            - paragraph [ref=f1e633]: 宛先MACアドレスが自分自身のMACアドレスと一致するフレーム（＝自分宛てのユニキャスト）
          - listitem [ref=f1e635]:
            - generic [ref=f1e636]: "2."
            - paragraph [ref=f1e640]: 宛先MACアドレスがブロードキャストアドレス（FF-FF-FF-FF-FF-FF）のフレーム
          - listitem [ref=f1e642]:
            - generic [ref=f1e643]: "3."
            - paragraph [ref=f1e647]: 宛先MACアドレスが、自分が参加しているマルチキャストグループのフレーム
        - paragraph [ref=f1e648]: つまり普段は「自分に関係ないフレームはハードウェアの時点で捨てる」のがNICのデフォルト動作です。これは、無関係な通信をいちいちOSに渡してCPUの処理負荷を上げないための、正しく効率的な仕組みです。
        - paragraph [ref=f1e649]:
          - strong [ref=f1e650]: なぜキャプチャサーバではこれが困る（前提知識②）
        - paragraph [ref=f1e651]:
          - text: ところが今回、可視化サーバやキャプチャサーバがNPBから受け取る「ミラーパケット」は、そもそも
          - strong [ref=f1e652]: 可視化サーバ・キャプチャサーバ宛てのフレームではありません
          - text: 。
        - paragraph [ref=f1e653]: まず「NPBがミラーパケットをこれらのサーバに送信している」こと自体は、本文に明記されています（①）。「可視化サーバは複製されたパケット（以下、ミラーパケットという）を受信して統計処理を行い、時系列グラフによって可視化をすることができる。キャプチャサーバは大容量のストレージをもち、ミラーパケットをそのまま長期間保存することができ」、さらに「NPBは受信したミラーパケットを必要なパケットだけにフィルタリングした後に再度複製し、⑥可視化サーバとキャプチャサーバに送信する。」とあります。つまりNPBは、L2SWのミラーポートから受け取ったミラーパケットをフィルタリングした上でもう一度複製し、可視化サーバとキャプチャサーバの両方に送りつける、という動作が本文に書かれています。ミラーパケットの中身は、コントローラが制御サーバへ送った測定データのフレームをそのまま複製したものなので、宛先MACアドレスは「制御サーバのMACアドレス」であり、可視化サーバ・キャプチャサーバ自身のMACアドレスとは一致しません。
        - paragraph [ref=f1e654]: そのため、可視化サーバ・キャプチャサーバのNICが通常モードのままだと、上記1〜3のどれにも該当しない「他人（制御サーバ）宛てのフレーム」として、届いたミラーパケットをNIC側でことごとく捨ててしまいます。これではせっかくNPBが複製して送ってきても、サーバのアプリケーションには何も届かず、可視化やキャプチャができません。
        - paragraph [ref=f1e655]:
          - strong [ref=f1e656]: プロミスキャスモードで解決する
        - paragraph [ref=f1e657]: そこでNICを**プロミスキャスモード（無差別モード）**に設定します。このモードでは、NICは宛先MACアドレスによる選別を行わず、届いたフレームを宛先に関係なく全て上位層に渡すようになります。これにより、宛先が制御サーバになっているミラーパケットも捨てられずにOS・キャプチャアプリケーションまで届くようになり、統計処理や長期保存が可能になります。
        - paragraph [ref=f1e658]: 以上をまとめると、答えの「宛先MACアドレスが自分のMACアドレス以外のフレーム」というのは、通常モードなら3.のマルチキャストや2.のブロードキャストを除き基本的に捨てられていたフレーム全般を指しており、プロミスキャスモードにすることで初めてそれらを受信できるようになる、という意味です。
        - 'heading "設問3(5): キャプチャサーバに1,000日間のミラーパケットを保存するのに必要なディスク容量は？" [level=3] [ref=f1e659]'
        - paragraph [ref=f1e660]:
          - strong [ref=f1e661]: "答え: 1,080（Gバイト）"
        - paragraph [ref=f1e662]: "計算過程:"
        - code [ref=f1e665]: 平均トラフィック = 100 kビット/秒 = 100 × 10^3 ビット/秒 1日の総量 = 100×10^3 × 86,400秒 = 8,640,000,000 ビット/日 = 8.64 × 10^9 ビット/日 1,000日分 = 8.64 × 10^9 × 1,000 = 8.64 × 10^12 ビット バイトに変換（÷8） = 1.08 × 10^12 バイト Gバイトに変換（÷10^9） = 1,080 Gバイト
